name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Aucune dependance a installer : le depot n'en a aucune.
      - name: Suite de tests
        run: npm test
