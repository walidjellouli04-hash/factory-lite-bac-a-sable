<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de visites</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Carnet de visites</h1>
    <p class="sous-titre">Suivi des visites commerciales sur le terrain</p>
  </header>

  <main>
    <section class="carte">
      <h2>Nouvelle visite</h2>
      <form id="formulaire" novalidate>
        <div class="champs">
          <label>Client <input name="client" required minlength="2" placeholder="Mairie de …"></label>
          <label>Ville <input name="ville" required minlength="2" placeholder="Tours"></label>
          <label>Date <input name="date" type="date" required></label>
          <label>Statut
            <select name="statut">
              <option value="planifiee">Planifiée</option>
              <option value="realisee">Réalisée</option>
              <option value="annulee">Annulée</option>
            </select>
          </label>
        </div>
        <div class="pleine">
          <span id="libelle-cr">Compte rendu</span>
          <div class="barre-cr" role="toolbar" aria-label="Mise en forme">
            <button type="button" class="outil" data-action="souligner" aria-label="Souligner"><u>S</u></button>
            <button type="button" class="outil cr-rouge" data-couleur="rouge" aria-label="Rouge">A</button>
            <button type="button" class="outil cr-bleu" data-couleur="bleu" aria-label="Bleu">A</button>
            <button type="button" class="outil cr-vert" data-couleur="vert" aria-label="Vert">A</button>
            <button type="button" class="outil cr-orange" data-couleur="orange" aria-label="Orange">A</button>
          </div>
          <div id="editeur-cr" class="editeur-cr" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="libelle-cr"></div>
          <input type="hidden" name="compteRendu">
        </div>
        <button type="submit">Enregistrer la visite</button>
        <p id="erreurs" class="erreurs" hidden></p>
      </form>
    </section>

    <section class="carte">
      <h2>Visites <span id="compteur" class="compteur">0</span></h2>
      <ul id="liste" class="liste"></ul>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
